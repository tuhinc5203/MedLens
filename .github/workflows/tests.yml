name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y $(cat packages.txt)
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
        env:
          MEDLENS_OFFLINE: "1"
